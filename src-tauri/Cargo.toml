[package]
name = "app"
version = "0.1.0"
description = "VC:MP Browser"
authors = ["Spiller"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.93"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# server query protocol, kept separate so it can be tested off-Windows
vcmp-protocol = { path = "../crates/vcmp-protocol" }

# querying every server at once needs async UDP and timers
tokio = { version = "1", features = ["net", "time", "rt", "macros"] }

# extracting version archives; pure Rust, so no bundled 7z.dll
sevenz-rust2 = "0.23"

discord-rich-presence = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Launching the game means Win32 process creation and DLL injection, which only
# exist on Windows. Gating them here lets the crate resolve on other hosts.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
